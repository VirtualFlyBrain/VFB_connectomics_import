[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vfb-connectomics-import"
version = "0.1.0"
description = "VirtualFlyBrain connectome import: connectivity, curation TSVs and template images"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.optional-dependencies]
# The image job needs none of the connectivity stack (vfb_connect, neuprint-python,
# python-catmaid, jsonpath-rw, fafbseg). Keeping it separate matters practically: the
# Jenkins node has only Python 3.9, and neuprint-python needs 3.10+, so installing
# everything would fail on a job that does not need any of it.
images = [
    "navis", "flybrains>=0.6.3", "trimesh", "shapely", "scipy", "numpy",
    "cloud-volume", "skeletor", "pynrrd", "plotly", "certifi",
    # Exact pin — see the note in requirements.txt. 0.1.13 and 0.2.0 both claim 3.9
    # support but ship no cp39 wheel and have 3.10-only source.
    "fast-simplification==0.1.12",
    "pandas",
]

[project.scripts]
# Jenkins should call these, not file paths — then a future re-layout breaks nothing.
vfb-em-images     = "vfb_connectomics_import.images.loader:main"
# Kept so existing Jenkins jobs keep working. It now takes --connectome and defaults to
# banc, so an unchanged BANC job behaves exactly as before.
vfb-banc-images   = "vfb_connectomics_import.images.loader:main"
vfb-banc-compare  = "vfb_connectomics_import.images.compare:main"
vfb-banc-bake     = "vfb_connectomics_import.images.bake_fields:main"
# Connectivity builds: each takes --site (the VFB Site short_form) and derives the
# source release from it; see connectivity/provenance.py.
vfb-n2n-banc      = "vfb_connectomics_import.connectivity.cli.banc:main"
vfb-n2n-neuprint  = "vfb_connectomics_import.connectivity.cli.neuprint:main"
vfb-n2n-flywire   = "vfb_connectomics_import.connectivity.cli.flywire:main"
vfb-n2n-catmaid   = "vfb_connectomics_import.connectivity.cli.catmaid:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
"vfb_connectomics_import.connectivity" = ["data_owl/*", "data_tsv/*", "resources/*"]
