# =============================================================================
# VFB Connectome Import — dashboard manifest
# =============================================================================
# The ONE hand-maintained file. Holds only *stable identity* facts about each
# connectome plus a "probe" per stage-cell describing HOW to check that cell
# automatically. Volatile status (done? live? needs update?) is NEVER typed by
# a human — it is derived by the probes each time the dashboard is generated.
#
# Each stage-cell may define up to three probes:
#   fill:   what colour the cell is                                  (required)
#   update: optional check that flips a "done" cell to "needs update"
#   live:   optional PDB Cypher check -> adds the "LIVE in release" dot
#
# Probe types (see probes.py):
#   owl_index        - matching OWL live on the VFB data server? (auto-discovers)
#   repo_glob        - matching artifact present in this repo?
#   jenkins          - Jenkins job status (running -> in_progress, ok -> done)
#   neuprint_upstream- newer version upstream? (needs NEUPRINT_TOKEN env)
#   gcs_versions     - newer version folder in a public GCS bucket? (BANC)
#   pdb_cypher       - query PDB; nonzero result -> live in current release
#   pdb_dataset      - this version's Site/DataSet record PUBLISHED in PDB?
#   kb_cypher        - query the KB; nonzero -> curated (done) even if unreleased
#   kb_dataset       - this version's Site/DataSet record CURATED in the KB?
#                      Prefer this for the `dataset` cell: the record is authored
#                      in the KB and PDB only catches up at the next release, so
#                      probing PDB for a built-but-unreleased version reports
#                      not_started — i.e. claims nobody started. Needs KB creds.
#   manual           - fixed state written here (WILL drift — avoid)
#
# `version` is the version being TARGETED. Add `built_version` when the artifacts
# on the data server came from an OLDER version than the target (mid-migration) —
# the update probes compare against built_version, so the cell stays honestly
# orange instead of claiming parity with upstream. Omit it when they agree.
#
# NOTE: the KB and PDB do not spell short_forms identically (the KB keeps the
# neuPrint hyphen, e.g. `male-cns_v1_0`; PDB publishes `male_cns_v1_0`). Give
# `kb_site` / `kb_dataset` alongside `vfb_site` / `vfb_dataset` where they differ;
# the KB probe falls back to the vfb_* keys when they don't.
#
# Fill colours:
#   done         green   - built & uploaded to the VFB data server
#   needs_update orange  - done, but a newer upstream version exists
#   in_progress  red     - being worked / job running / not live yet
#   not_started  grey    - nothing done yet (a probe RAN and found nothing)
#   unknown      hatched - a probe could not determine state, OR no probe is
#                          wired for that cell yet. Never claims work is undone.
#
# Live dot (from PDB):  ● live now   ○ done but NOT live in this release yet
# =============================================================================

meta:
  owl_index_url: https://virtualflybrain.org/data/VFB/OWL/
  pdb_tx_url: https://pdb.virtualflybrain.org/db/data/transaction/commit
  # KB = the curation database, where records are authored before release.
  # Needs HTTP Basic auth (KB_USER / KB_PASSWORD); probes degrade to "unknown"
  # when those are unset, so this being present is harmless on its own.
  # HTTPS, not HTTP: Basic auth puts the credential on the wire in a trivially
  # reversible base64, so plaintext http:// would expose it. Verified both work.
  kb_tx_url: https://kb.virtualflybrain.org/db/data/transaction/commit
  jenkins_base: ""            # TODO team: e.g. https://jenkins.virtualflybrain.org
  github_repo: VirtualFlyBrain/VFB_connectomics_import

# Matrix columns, left to right. Add a stage anytime — the generator just
# iterates this list, so a new column is one line here + a probe per connectome.
stages:
  - {id: dataset, label: "Dataset record"}      # Site + DataSet KB nodes exist (earliest step)
  - {id: neurons, label: "Neurons loaded"}
  - {id: skel,    label: "Skeletons / Meshes"}
  - {id: rois,    label: "ROIs loaded"}
  - {id: domains, label: "Painted domains"}      # 3D neuropil region meshes / L-R domain individuals (issue #10)
  - {id: n2n,     label: "Connectivity n→n"}
  - {id: n2r,     label: "Connectivity n→r"}
  - {id: types,   label: "FBbt annotations done"}
  - {id: retired, label: "Old version retired"}  # update done: term_replaced_by added, dropped neurons deprecated

# vfb_site values below were checked against the live PDB Site list. Where the
# TARGET version is not yet a live Site, the live dot will correctly stay OFF.
connectomes:

  - id: malecns
    label: "male-CNS"
    provider: neuprint
    version: "1.0"
    # TARGET version is v1.0. KB and PDB spell the Site differently (KB keeps the
    # neuPrint hyphen, PDB underscores it), so both names are given.
    vfb_dataset: Berg2025a         # v1.0 DataSet. PDB still only has Berg2025 (v0.9)
    vfb_site: male_cns_v1_0        # PDB spelling; PDB is still on male_cns_v0_9
    kb_site: male-cns_v1_0         # KB spelling; is_data_source already set here
    kb_dataset: Berg2025a
    neuprint_dataset: "male-cns"
    runner: src/vfb_connectomics_import/connectivity/cli/neuprint.py
    owner: adm
    stages:
      # Curated in the KB (v1.0 Site is already the data source there); the live
      # dot is what reports whether it has reached PDB.
      dataset: {fill: {type: kb_dataset}, live: {type: pdb_cypher}}
      # 166,701 v1.0 neurons are loaded in the KB but not yet released, so "done"
      # has to come from the KB; the live dot reports whether PDB has them.
      neurons: {fill: {type: kb_cypher, expect: exists}, live: {type: pdb_cypher}}
      skel:    {fill: {type: jenkins, job: ""}}
      n2n:
        fill:   {type: owl_index, match: 'connectome_malecns.*n2n\.owl'}
        update: {type: neuprint_upstream}
        live:   {type: pdb_cypher}
      n2r:  {fill: {type: owl_index, match: 'connectome_malecns.*n2r\.owl'}, live: {type: pdb_cypher}}
      types: {fill: {type: manual, state: not_started}}

  - id: manc
    label: "MANC"
    provider: neuprint
    version: "1.2.1"
    vfb_site: neuprint_JRC_Manc_1_2_1
    neuprint_dataset: "manc"
    runner: src/vfb_connectomics_import/curation/manc.py
    owner:
    stages:
      dataset: {fill: {type: pdb_dataset}}
      neurons: {fill: {type: pdb_cypher, expect: exists}, live: {type: pdb_cypher}}
      skel:    {fill: {type: jenkins, job: ""}}
      n2n:
        fill:   {type: owl_index, match: 'connectome_manc\.owl'}
        update: {type: neuprint_upstream}
        live:   {type: pdb_cypher}
      n2r:  {fill: {type: owl_index, match: 'connectome_manc.*n2r\.owl'}, live: {type: pdb_cypher}}
      types: {fill: {type: manual, state: not_started}}

  - id: hemibrain
    label: "Hemibrain"
    provider: neuprint
    version: "1.2.1"
    vfb_site: neuprint_JRC_Hemibrain_1point2point1
    neuprint_dataset: "hemibrain"
    runner: src/vfb_connectomics_import/connectivity/cli/neuprint.py
    owner:
    stages:
      dataset: {fill: {type: pdb_dataset}}
      neurons: {fill: {type: pdb_cypher, expect: exists}, live: {type: pdb_cypher}}
      skel:    {fill: {type: jenkins, job: ""}}
      n2n:
        fill:   {type: owl_index, match: 'neuprint_JRC_Hemibrain.*connectomics\.owl'}
        update: {type: neuprint_upstream}
        live:   {type: pdb_cypher}
      n2r:  {fill: {type: repo_glob, match: 'src/vfb_connectomics_import/connectivity/data_tsv/*hb*n2r*'}, live: {type: pdb_cypher}}
      types: {fill: {type: manual, state: not_started}}

  - id: opticlobe
    label: "Optic Lobe"
    provider: neuprint
    version: "1.0.1"
    vfb_site: neuprint_JRC_OpticLobe_v1_0_1
    neuprint_dataset: "optic-lobe"
    runner: src/vfb_connectomics_import/curation/optic_lobe.py
    owner: adm
    stages:
      dataset: {fill: {type: pdb_dataset}}
      neurons: {fill: {type: pdb_cypher, expect: exists}, live: {type: pdb_cypher}}
      skel:    {fill: {type: jenkins, job: ""}}
      n2n:
        fill:   {type: owl_index, match: 'connectome_jrc_ol\.owl'}
        update: {type: neuprint_upstream}
        live:   {type: pdb_cypher}
      n2r:  {fill: {type: owl_index, match: 'connectome_jrc_ol.*n2r\.owl'}, live: {type: pdb_cypher}}
      types: {fill: {type: manual, state: not_started}}

  - id: flywire
    label: "FlyWire (FAFB)"
    provider: cave
    version: "783"
    vfb_dataset: Dorkenwald2023
    vfb_site: flywire783
    runner: src/vfb_connectomics_import/curation/flywire.py
    owner: adm
    stages:
      dataset: {fill: {type: pdb_dataset}}
      neurons: {fill: {type: pdb_cypher, expect: exists}, live: {type: pdb_cypher}}
      skel:    {fill: {type: jenkins, job: ""}}
      n2n:  {fill: {type: owl_index, match: 'connectome_flywire_fafb\.owl'}, live: {type: pdb_cypher}}
      n2r:  {fill: {type: owl_index, match: 'connectome_flywire.*n2r\.owl'}, live: {type: pdb_cypher}}
      types: {fill: {type: manual, state: not_started}}

  - id: banc
    label: "BANC"
    provider: gcs
    # TARGET is v888 (KB DataSet Bates2026, Site BANC888 — already is_data_source
    # there). PDB is still on v626 / Bates2025, so the live dots stay off until
    # release. KB and PDB spell BANC short_forms identically, so no kb_* overrides.
    version: "888"
    built_version: "626"           # the OWL on the data server is still v626-derived
    vfb_dataset: Bates2026         # v626 was Bates2025; 15,779 of its neurons are dropped in v888
    vfb_site: BANC888
    runner: src/vfb_connectomics_import/connectivity/cli/banc.py
    owner: adm
    stages:
      dataset: {fill: {type: kb_dataset}, live: {type: pdb_cypher}}
      # 146,511 v888 neurons are in the KB, unreleased — see the malecns entry.
      neurons: {fill: {type: kb_cypher, expect: exists}, live: {type: pdb_cypher}}
      # The BANC image loader. Runs images/loader.py; see the README BANC section.
      # First full brain run started 2026-08-27. --region vnc is the other half.
      skel:    {fill: {type: jenkins, job: "load-banc-neurons"}}
      n2n:
        # connectome_BANC_n2n.owl is still v626-derived, and its filename carries no
        # version for owl_index to discriminate on — hence `built_version` above,
        # which keeps this cell honestly orange until it is rebuilt from the v888
        # parquet. Bump built_version to 888 when that is done (and consider putting
        # the version in the OWL filename so owl_index can do this unaided).
        fill:   {type: owl_index, match: 'connectome_BANC_n2n\.owl'}
        update: {type: gcs_versions, bucket: lee-lab_brain-and-nerve-cord-fly-connectome, prefix: 'neuron_connectivity/', pattern: 'v(\d+)'}
        live:   {type: pdb_cypher}
      n2r:  {fill: {type: manual, state: not_started}}
      types: {fill: {type: manual, state: not_started}}

  - id: fafb
    label: "FAFB (CATMAID)"
    provider: catmaid
    vfb_site: catmaid_fafb
    runner: src/vfb_connectomics_import/connectivity/cli/catmaid.py
    owner: adm
    issue: 8
    stages:
      dataset: {fill: {type: pdb_dataset}}
      neurons: {fill: {type: pdb_cypher, expect: exists}, live: {type: pdb_cypher}}
      skel:    {fill: {type: manual, state: not_started}}
      n2n:  {fill: {type: owl_index, match: 'FAFB_CATMAID_import\.owl'}, live: {type: pdb_cypher}}
      n2r:  {fill: {type: manual, state: not_started}}
      types: {fill: {type: manual, state: not_started}}

  - id: l1em
    label: "L1EM (CATMAID)"
    provider: catmaid
    vfb_site: catmaid_l1em
    runner: src/vfb_connectomics_import/connectivity/cli/catmaid.py
    owner: adm
    issue: 15
    stages:
      dataset: {fill: {type: pdb_dataset}}
      neurons: {fill: {type: pdb_cypher, expect: exists}, live: {type: pdb_cypher}}
      skel:    {fill: {type: manual, state: not_started}}
      n2n:  {fill: {type: owl_index, match: 'L1EM_CATMAID_import\.owl'}, live: {type: pdb_cypher}}
      n2r:  {fill: {type: manual, state: not_started}}
      types: {fill: {type: manual, state: not_started}}
