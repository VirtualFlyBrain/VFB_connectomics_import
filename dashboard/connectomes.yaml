      neurons: {fill: {type: pdb_cypher, expect: exists}, live: {type: pdb_cypher}}
      skel:    {fill: {type: manual, state: not_started}}
      n2n:  {fill: {type: owl_index, match: 'L1EM_CATMAID_import\.owl'}, live: {type: pdb_cypher}}
      n2r:  {fill: {type: manual, state: not_started}}
      types: {fill: {type: manual, state: not_started}}
